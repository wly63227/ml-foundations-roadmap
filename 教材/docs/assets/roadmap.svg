<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="210" viewBox="0 0 1040 210" role="img" aria-labelledby="title desc">
<title id="title">16 周机器学习入门路线</title><desc id="desc">编程三周、数学复习三周、经典模型四周、神经网络四周、项目两周。色块宽度按周数比例绘制。</desc>
<rect width="1040" height="210" rx="16" fill="#f2f6f4"/>
<g font-family="sans-serif" font-size="18" fill="#143e34"><text x="28" y="36">16 周，按能力推进</text><text x="28" y="184" font-size="15">先自测 → 只补遗忘点 → 手算与代码核对 → 达标再前进</text></g>
<g stroke="#fff" stroke-width="3"><rect x="28" y="60" width="184.5" height="88" rx="8" fill="#d3e8df"/><rect x="212.5" y="60" width="184.5" height="88" rx="8" fill="#b8d8cc"/><rect x="397" y="60" width="246" height="88" rx="8" fill="#85b8a5"/><rect x="643" y="60" width="246" height="88" rx="8" fill="#39715e"/><rect x="889" y="60" width="123" height="88" rx="8" fill="#205341"/></g>
<g text-anchor="middle" font-family="sans-serif" font-size="18"><g fill="#123d31"><text x="120" y="97">编程起步</text><text x="120" y="126" font-size="15">第 1–3 周</text><text x="305" y="97">数学唤醒</text><text x="305" y="126" font-size="15">第 4–6 周</text><text x="520" y="97">经典模型</text><text x="520" y="126" font-size="15">第 7–10 周</text></g><g fill="#fff"><text x="766" y="97">神经网络</text><text x="766" y="126" font-size="15">第 11–14 周</text><text x="950" y="97">项目</text><text x="950" y="126" font-size="15">第 15–16 周</text></g></g></svg>
